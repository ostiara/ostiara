# Developers can see pods and logs, but only the broker can exec into them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ostiara-developer
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
# Example binding for the demo namespace; swap in your own users or groups.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ostiara-developer
  namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ostiara-developer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: alice
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: bob
