# ostiara broker: the only identity with pods/exec.
apiVersion: v1
kind: Namespace
metadata:
  name: ostiara-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ostiara-broker
  namespace: ostiara-system
---
# Cluster-wide, the broker may only check callers' tokens.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ostiara-broker-auth
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ostiara-broker-auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ostiara-broker-auth
subjects:
  - kind: ServiceAccount
    name: ostiara-broker
    namespace: ostiara-system
---
# Exec rights, granted per namespace by deploy/broker-namespace.yaml; never bound cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ostiara-broker-exec
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ostiara-broker
  namespace: ostiara-system
spec:
  replicas: 1 # in-memory sessions: exactly one
  selector:
    matchLabels: { app: ostiara-broker }
  template:
    metadata:
      labels: { app: ostiara-broker }
    spec:
      serviceAccountName: ostiara-broker
      containers:
        - name: broker
          image: ostiara:dev
          imagePullPolicy: IfNotPresent
          args:
            - -addr=:8080
            - -auth=tokenreview
            - -token-audience=ostiara # drop for EKS/GKE logins, whose tokens are for the API server
            - -tls-cert=/etc/ostiara/tls/tls.crt
            - -tls-key=/etc/ostiara/tls/tls.key
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080, scheme: HTTPS }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tls
              mountPath: /etc/ostiara/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: ostiara-broker-tls # create it first, e.g. hack/broker-cert.sh on kind
---
apiVersion: v1
kind: Service
metadata:
  name: ostiara-broker
  namespace: ostiara-system
spec:
  selector: { app: ostiara-broker }
  ports:
    - port: 8080
      targetPort: 8080
