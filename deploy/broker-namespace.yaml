# Opts one namespace in to ostiara: copy per namespace and change metadata.namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ostiara-broker
  namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ostiara-broker-exec
subjects:
  - kind: ServiceAccount
    name: ostiara-broker
    namespace: ostiara-system
