# Practice pod for port-forward: serves one page on port 8080.
apiVersion: v1
kind: Pod
metadata:
  name: demo-web
  namespace: demo
spec:
  containers:
    - name: web
      image: busybox:1.36
      command: ["sh", "-c", "mkdir -p /www && echo hello-from-demo-web > /www/index.html && exec httpd -f -p 8080 -h /www"]
      ports:
        - containerPort: 8080
